name: Claude Config
version: 1.0.5
schema: v1

models:
  - name: Qwen-1.5b Autocomplete Model
    provider: ollama
    model: qwen2.5-coder:1.5b
    roles:
      - autocomplete

  - name: Claude 4 Sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 8192
    capabilities:
      - tool_use
      - image_input

  - name: Claude 3.5 Haiku
    provider: anthropic
    model: claude-3-5-haiku-latest
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 8192
    capabilities:
      - tool_use
      - image_input